name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build, bundle check and tests
        run: npm run check
      - name: Built file is committed
        run: git diff --exit-code index.html
